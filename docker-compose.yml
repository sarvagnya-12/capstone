services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dryrunai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dryrunai}
      POSTGRES_DB: ${POSTGRES_DB:-dryrunai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dryrunai} -d ${POSTGRES_DB:-dryrunai}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

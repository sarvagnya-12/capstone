<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A colour-up sheet: the stock, its ruled head, and three chips in a
       row, the middle one marked as the one taken forward. Drawn in the
       sheet's own inks (slate ground, bond stock, stamp green) so the mark
       and the interface are the same system. -->
  <rect width="32" height="32" fill="#2c3836"/>
  <rect x="5" y="4" width="22" height="24" fill="#f1f3f1"/>
  <rect x="8" y="7" width="16" height="1.5" fill="#15191a"/>
  <rect x="8" y="11" width="16" height="1" fill="#9ba39f"/>
  <rect x="8" y="15" width="4" height="9" fill="#9ba39f"/>
  <rect x="14" y="15" width="4" height="9" fill="#1a6b41"/>
  <rect x="20" y="15" width="4" height="9" fill="#15191a"/>
  <rect x="14" y="25.5" width="4" height="1.5" fill="#1a6b41"/>
</svg>

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router uses client-side routing (createBrowserRouter) -- a direct
    # load of e.g. /dashboard/<uuid> has no matching file on disk, so it must
    # fall back to index.html and let the client-side router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend container -- see frontend/.env.production
    # for why the built frontend calls a relative /api path instead of a
    # separate host:port.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
